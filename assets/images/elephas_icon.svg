<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <!-- App Icon - rounded square with elephant -->
  <rect width="192" height="192" fill="#6750A4" rx="38" ry="38" />
  
  <!-- Elephant silhouette -->
  <path d="M96,50 C120,50 140,65 150,85 C160,105 160,125 150,145
           C140,165 120,175 96,175 C72,175 52,165 42,145
           C32,125 32,105 42,85 C52,65 72,50 96,50 Z" 
        fill="#EAE0FF" />
        
  <!-- Elephant face details -->
  <path d="M96,70 C115,70 130,80 138,95 C146,110 146,125 138,140
           C130,155 115,160 96,160 C77,160 62,155 54,140
           C46,125 46,110 54,95 C62,80 77,70 96,70 Z" 
        fill="#6750A4" />
        
  <!-- Trunk -->
  <path d="M96,115 C105,120 110,125 108,135 C106,145 100,150 90,155" 
        stroke="#EAE0FF" stroke-width="10" fill="none" stroke-linecap="round" />
        
  <!-- Eyes -->
  <circle cx="80" cy="95" r="5" fill="white" />
  <circle cx="112" cy="95" r="5" fill="white" />
  
  <!-- Tusks -->
  <path d="M85,120 L75,135" stroke="white" stroke-width="4" stroke-linecap="round" />
  <path d="M107,120 L117,135" stroke="white" stroke-width="4" stroke-linecap="round" />
</svg>
