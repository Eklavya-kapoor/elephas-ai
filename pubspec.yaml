name: elephas_ai
description: Elephas AI - Real-time fraud protection using artificial intelligence
publish_to: 'none' # Ensures your package isn't accidentally published to pub.dev
version: 1.0.0+1 # Your application's version and build number

environment:
  sdk: '>=3.0.0 <4.0.0' # Defines the compatible Dart SDK range

dependencies:
  flutter:
    sdk: flutter

  # Core Flutter icons
  cupertino_icons: ^1.0.2

  # Networking
  http: ^1.1.0

  # Permission handling
  permission_handler: ^12.0.0

  # Device feedback is now handled through Flutter's built-in haptic feedback

  # SMS and Call Log access
  flutter_sms_inbox: ^1.0.2
  call_log: ^6.0.0

  # Real phone contacts sync (contacts_service removed - namespace issues on new AGP)
  flutter_contacts: ^1.1.9+2

  # Local data storage
  shared_preferences: ^2.2.2

  # State management
  provider: ^6.1.1
  
  # UI Components
  fluttertoast: ^8.2.12 # Toast messages
  flutter_local_notifications: ^19.0.0 # Local notifications
  url_launcher: ^6.2.2 # Launching URLs (e.g., in browser)
  
  # Device & System Integration - using permission_handler for settings navigation
  package_info_plus: ^8.3.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0 # Linter rules for code quality

# The "flutter" section is specific to Flutter projects
flutter:
  # Ensures that the Material Icons font is included
  uses-material-design: true

  # Assets section for images and other resources
  assets:
    - assets/images/
    - assets/images/URL_ALERT.PNG  # URL alert image
    - assets/images/overlay.png
    - android/app/src/main/res/drawable/overlay_image.png
    - assets/images/elephas_icon.png
    - assets/images/elephas_logo.png
    - assets/images/elephas_logo_full.png

  # To add custom fonts, uncomment the fonts section. Example:
  # fonts:
  #   - family: YourCustomFont
  #     fonts:
  #       - asset: fonts/YourCustomFont-Regular.ttf
  #       - asset: fonts/YourCustomFont-Bold.ttf
  #         weight: 700